<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mutation Observer -- Frontend System Design Fundamentals</title>
    <link rel="stylesheet" href="../styles/index.css">
    <template id="cardTemplate">
        <article class="card">
            <h3 class="card__title"></h3>
            <p contenteditable="true">Hello.., edit me..</p>
            <div class="card__body">
                <div class='card__body__image'></div>
                <section class='card__body__content' contenteditable="true">
                </section>
            </div>
        </article>
    </template>
</head>
<body>
<main id="container" class="container">
  <div id="list"></div>
  <div id="bottomObserver">
    Bottom observer..
  </div>
</main>
<script type="module">
  // Running the file using path throws CORS. Solution: Run the project using `npx serve`
  // then Access the file on running port. i.e.: localhost:3000/2-mutation-observer
  import { initMockDB } from "../../utils/db.js"
  import { createCardElement, getHeading } from "./utils-mutation.js";

  const SUPPORTED_ELEMENTS = new Set([
    '/h1',
    '/h2',
    '/h3'
  ]);

  const [
    list,
    observerElement
  ] = document.querySelectorAll('#list, #bottomObserver')

  const db = initMockDB({
    title: "Fundamentals of Frontend System Design",
    body: "Learning to use mutation observer..."
  })

    /**
     * Exercise - Mutation observer
     * 1. Loop through mutations (first arg callback)
     * 2. use mutation.type === 'characterData'
     * 3. When the content matches with any supported tag in SUPPORTED_ELEMENTS
     *    use getHeading function to convert text to HTMLHeading element
     * 4. Replace the node with a newly created node
     * 5. Keep focus on the element
     */
    const mutationObserver = new MutationObserver((mutations) => {
      for (const { target, type } of mutations) {
        if (type === "characterData" && SUPPORTED_ELEMENTS.has(target?.textContent)) {
          console.log('mutation observer callback: ', target);
          const element = getHeading(target);
          target.replaceWith(element);
          element.focus();
        }
      }
    });

    let page = 0;
    const observer = new IntersectionObserver(async ([entry]) => {
      if(entry.isIntersecting) {
        observerElement.textContent = 'Loading...';
        const data = await db.getPage(page++);
        const fragment = new DocumentFragment();
        data.forEach(({title, body}) => {
          const card = createCardElement(title, body);
          fragment.appendChild(card);
          const content = card.querySelector('.card__body__content');
          mutationObserver.observe(content, { characterData: true, subtree: true });
        });
        list.appendChild(fragment);
      }
    }, {
      threshold: 0.2
    });

    observer.observe(observerElement);
</script>
</body>
</html>
